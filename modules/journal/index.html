    </div>

  <div class="site-head">
    <h1 class="langline--center" data-phrase></h1>
    <div class="rule"></div>
    <p>Notes, journeys, and moments worth remembering.</p>
  </div>

  <div id="cards" class="cards"></div>
  <div id="loading" class="loading">opening the journal...</div>

<script src="js/core.js"></script>
<script>
/* Read-only. Stories are published from the editor, which lives elsewhere; all
   this page ever does is fetch data/index.json and draw a card per entry. */
(async function () {
  const J = window.JOURNAL;
  const cards = document.getElementById("cards");
  const loading = document.getElementById("loading");

  try {
    const res = await fetch("data/index.json?t=" + Date.now(), { cache: "no-store" });
    const list = res.ok ? await res.json() : [];
    loading.style.display = "none";

    if (!Array.isArray(list) || list.length === 0) {
      const owner = (window.SIDVERSE && window.SIDVERSE.owner) || "Siddhesh";
      cards.innerHTML = '<div class="empty empty--bare">'
        + '<p class="empty__line">The first page is still blank</p>'
        + '<p class="empty__sub">' + J.escapeHtml(owner) + " writes these one at a time. "
        + "When the next one is finished, it will be sitting right here.</p></div>";
      return;
    }

    list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    cards.innerHTML = list.map(post => {
      const thumb = post.thumb
        ? '<img class="thumb" src="' + J.escapeHtml(post.thumb) + '" alt="" loading="lazy" decoding="async">'
        : '<div class="thumb placeholder">&#10047;</div>';
      return '<a class="card" href="story.html?id=' + encodeURIComponent(post.id) + '">'
        + thumb
        + '<div class="c-date">' + J.escapeHtml(J.formatDate(post.date)) + "</div>"
        + '<div class="c-title">' + J.escapeHtml(post.title || "Untitled") + "</div></a>";
    }).join("");
  } catch (error) {
    loading.innerHTML = "Could not load stories yet.";
  }
})();
</script>
  <script defer src="../../assets/js/motion.js"></script>
</body>
