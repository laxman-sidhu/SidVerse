<!DOCTYPE html>
<html lang="en" data-section="cinema">
<head>
<script>(function(){try{var t=localStorage.getItem("sidverse:theme")||"light";document.documentElement.setAttribute("data-theme",t);document.documentElement.setAttribute("data-bs-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SidVerse - SidCinemas</title>
  <meta name="description" content="Everything queued up to watch.">
  <meta name="theme-color" content="#fafbfd" id="themeColor">

  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("sidverse:theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.bsTheme = dark ? "dark" : "light";
    })();
  </script>

  <!-- Favicon, and the same icon for link previews -->
  <link rel="icon" type="image/png" sizes="any" href="../../assets/images/sidverse-icon.png">
  <link rel="apple-touch-icon" href="../../assets/images/sidverse-icon.png">
  <link rel="canonical" href="https://laxman-sidhu.github.io/SidVerse/modules/cinema/watchlist.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SidVerse">
  <meta property="og:title" content="SidVerse - SidCinemas">
  <meta property="og:description" content="Everything queued up to watch.">
  <meta property="og:url" content="https://laxman-sidhu.github.io/SidVerse/modules/cinema/watchlist.html">
  <meta property="og:image" content="https://laxman-sidhu.github.io/SidVerse/assets/images/sidverse-preview.jpg">
  <meta property="og:image:secure_url" content="https://laxman-sidhu.github.io/SidVerse/assets/images/sidverse-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="600">
  <meta property="og:image:alt" content="The SidVerse mark">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SidVerse - SidCinemas">
  <meta name="twitter:description" content="Everything queued up to watch.">
  <meta name="twitter:image" content="https://laxman-sidhu.github.io/SidVerse/assets/images/sidverse-preview.jpg">
  <meta name="twitter:image:alt" content="The SidVerse mark">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/shell.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script defer src="../../assets/js/site.config.js"></script>
<script defer src="../../assets/js/shell.js" data-root="../.."></script>
<link rel="stylesheet" href="../../assets/css/universal.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/motion.css">
</head>

<body class="page-collection">
  <div class="wash" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="wordmark" href="index.html"></a>

      <!-- Built by js/ui/nav.js from one list, so adding a destination is a change in a single file. -->
      <div class="topbar__tools" id="navTools"></div>
    </div>
  </header>

  <main class="wrap coll">
    <div class="coll__head">
      <p class="coll__eyebrow" id="collEyebrow">Watchlist</p>
      <h1 class="coll__title" id="collTitle">Queued up to watch</h1>
      <p class="coll__lead" id="collLead"></p>

      <div class="stats" id="collStats"></div>
      <div class="split" id="collSplit" hidden></div>
    </div>

    <div class="collbar">
      <div class="collbar__search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="visually-hidden" for="collSearch">Search my library</label>
        <input id="collSearch" type="search" placeholder="Search the watchlist&hellip;" autocomplete="off">
        <button type="button" id="collClear" hidden aria-label="Clear">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <label class="facets facets--inline">
        <span class="facets__label">Industry</span>
        <span class="facets__wrap">
          <select class="facets__select" id="collCategory"></select>
          <svg class="facets__caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </label>

      <label class="facets facets--inline">
        <span class="facets__label">Genre</span>
        <span class="facets__wrap">
          <select class="facets__select" id="collGenre"></select>
          <svg class="facets__caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </label>

      <label class="facets facets--inline">
        <span class="facets__label">Sort</span>
        <span class="facets__wrap">
          <select class="facets__select" id="collSort">
            <option value="recent">Sheet order</option>
            <option value="alpha">A &ndash; Z</option>
            <option value="year">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
          <svg class="facets__caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </label>

      <p class="collbar__count"><span id="collCount">0</span> shown</p>
    </div>

    <div class="loading-line" id="collLoading" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span>Reading the sheet&hellip;</span>
    </div>

    <div id="collGrid"></div>

    <div class="loadmore" id="collMore" hidden>
      <button type="button" class="btn-ghost" id="collMoreBtn">Show more</button>
    </div>

    <div class="state" id="collState" hidden>
      <h3 class="state__title" id="collStateTitle"></h3>
      <p class="state__text" id="collStateText"></p>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <p class="footer__line">Queued up, waiting for a free evening.</p>
      <p class="footer__made">Made with <span class="footer__heart">&#128150;</span> by <button type="button" class="footer__me" data-portrait-open aria-haspopup="dialog">ME</button></p>
    </div>
  </footer>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
      <div class="modal-content detail">
        <!-- The screen keeps a bar of its own: the room's name, and the way back. -->
        <div class="detail__topbar">
          <span class="detail__brand topbar__brand"></span>
          <button type="button" class="detail__back" data-bs-dismiss="modal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            <span>Back to SidCinemas</span>
          </button>
        </div>
        <div class="detail__body" id="detailBody"></div>
      </div>
    </div>
  </div>

  <script>
    window.PAGE_CONFIG = {
      // No flags on a Watchlist row, so no views control here.
      views: false,
      eyebrow: "Watchlist",
      title: "Queued up to watch",
      lead: "Nothing here has been watched yet.",
      emptyTitle: "Nothing queued up",
      emptyText: "Search for something and add it to the watchlist.",
      noMatch: "Nothing on the watchlist fits this combination. Try clearing a filter.",
      loadError: "Could not load the watchlist"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module">
    import { start } from "./js/pages/collection.js";
    import { wirePortrait } from "./js/ui/portrait.js";
    start();
    wirePortrait();
  </script>
  <script defer src="../../assets/js/motion.js"></script>
</body>
</html>
