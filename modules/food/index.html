<!DOCTYPE html>
<html lang="en" data-section="food">
<head>
<script>(function(){try{var t=localStorage.getItem("sidverse:theme")||"light";document.documentElement.setAttribute("data-theme",t);document.documentElement.setAttribute("data-bs-theme",t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SidVerse - SidBites</title>
<meta name="description" content="Every dish I've tried, where I ate it, and what I'd give it out of ten.">
<meta name="theme-color" content="#DCE3CD">
<!-- Favicon, and the same icon for link previews -->
<link rel="icon" type="image/png" sizes="any" href="../../assets/images/sidverse-icon.png">
<link rel="apple-touch-icon" href="../../assets/images/sidverse-icon.png">
<link rel="canonical" href="https://laxman-sidhu.github.io/SidVerse/modules/food/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SidVerse">
<meta property="og:title" content="SidVerse - SidBites">
<meta property="og:description" content="Every dish I've tried, where I ate it, and what I'd give it out of ten.">
<meta property="og:url" content="https://laxman-sidhu.github.io/SidVerse/modules/food/">
<meta property="og:image" content="https://laxman-sidhu.github.io/SidVerse/assets/images/sidverse-preview.jpg">
<meta property="og:image:secure_url" content="https://laxman-sidhu.github.io/SidVerse/assets/images/sidverse-preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta property="og:image:alt" content="The SidVerse mark">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="SidVerse - SidBites">
<meta name="twitter:description" content="Every dish I've tried, where I ate it, and what I'd give it out of ten.">
<meta name="twitter:image" content="https://laxman-sidhu.github.io/SidVerse/assets/images/sidverse-preview.jpg">
<meta name="twitter:image:alt" content="The SidVerse mark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/shell.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/theme.css">
<script defer src="../../assets/js/site.config.js"></script>
<script defer src="../../assets/js/shell.js" data-root="../.."></script>
<link rel="stylesheet" href="../../assets/css/universal.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/motion.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#top"></a>
</header>

<main id="top">
  <section class="hero">
    <div class="hero__text">
      <h1 class="hero__line" data-phrase></h1>
      <p class="hero__stat" id="heroStat">Reading the log…</p>
      <p class="hero__by" id="heroBy"></p>
    </div>

    <div class="keeper">
      <div class="keeper__blobs" aria-hidden="true">
        <span class="blob blob--sun"></span>
        <span class="blob blob--plum"></span>
        <span class="blob blob--warm"></span>
      </div>
      <img class="keeper__img" src="assets/images/keeper-cutout.webp" alt="The keeper of this log, mid-bite" width="900" height="1120" loading="lazy" decoding="async">

      <div class="topcard" id="heroTop" hidden>
        <img id="topImg" alt="" loading="lazy" decoding="async">
        <div class="topcard__text">
          <p class="eyebrow">Top of the log</p>
          <p class="topcard__name" id="topName"></p>
          <p class="topcard__place" id="topPlace"></p>
        </div>
        <span class="topcard__score" id="topScore"></span>
      </div>
    </div>
  </section>

  <div class="reel" aria-hidden="true"><div class="reel__track" id="reelTrack"></div></div>

  <section class="controls" id="controls">
    <div class="controls__row">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        <input type="search" id="search" placeholder="Search a dish or place" autocomplete="off">
      </div>
      <label class="sort">
        <span>Sort</span>
        <select id="sort">
          <option value="recent">Most recent</option>
          <option value="rating">Highest rated</option>
          <option value="name">A–Z</option>
          <option value="place">By place</option>
        </select>
      </label>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="results">
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p class="empty__title">Nothing matches that.</p>
      <p class="empty__note">Clear the search or pick another cuisine.</p>
    </div>
  </section>
</main>



<div class="lightbox" id="lightbox" hidden>
  <button class="lb__close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb__nav lb__nav--prev" id="lbPrev" aria-label="Previous dish">‹</button>
  <button class="lb__nav lb__nav--next" id="lbNext" aria-label="Next dish">›</button>
  <figure class="lb__figure" id="lbFigure">
    <div class="lb__media"><img id="lbImg" alt="" loading="lazy" decoding="async"></div>
    <figcaption class="lb__cap">
      <p class="lb__row">
        <span class="eyebrow" id="lbCuisine"></span>
        <span class="lb__score" id="lbScore"></span>
      </p>
      <h2 id="lbTitle"></h2>
      <p class="lb__place" id="lbPlace"></p>
    </figcaption>
  </figure>
</div>

<script type="module" src="assets/js/main.js"></script>
  <script defer src="../../assets/js/motion.js"></script>
</body>
</html>
