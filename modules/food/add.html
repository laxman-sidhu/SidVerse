<body>
<div class="grain" aria-hidden="true"></div>
<div class="wash" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="index.html"></a>
  <a class="btn-back" href="index.html">← Back to the log</a>
</header>

<main class="page">

  <!-- The gate is a dialog over this page, built by assets/js/gate.js. -->
  <section class="lock" id="lockPanel" hidden></section>

  <section id="formPanel" hidden>
    <header class="page__head">
      <h1 class="page__title">Add a dish</h1>
      <p class="page__note">Everything here lands in the sheet and shows up on the log straight away.</p>
    </header>

    <form id="addForm" class="form">

      <section class="group">
        <p class="group__label">What you ate</p>
        <div class="field">
          <label for="fDish">Dish</label>
          <input type="text" id="fDish" placeholder="Rock Shrimp" required>
        </div>
        <div class="field">
          <label for="fCuisine">Cuisine</label>
          <input type="text" id="fCuisine" list="cuisineList" placeholder="Japanese" required>
          <datalist id="cuisineList"></datalist>
        </div>
      </section>

      <section class="group">
        <p class="group__label">Where you ate it</p>
        <div class="field-row">
          <div class="field">
            <label for="fWhere">Place</label>
            <input type="text" id="fWhere" list="placeList" placeholder="Chef James" required>
            <datalist id="placeList"></datalist>
          </div>
          <div class="field">
            <label for="fLocation">Location</label>
            <input type="text" id="fLocation" list="locList" placeholder="Malad west, Mumbai" required>
            <datalist id="locList"></datalist>
          </div>
        </div>
      </section>

      <section class="group">
        <p class="group__label">The verdict</p>
        <div class="field-row">
          <div class="field">
            <label for="fDate">Date tried</label>
            <input type="date" id="fDate" required>
          </div>
          <div class="field">
            <label for="fRating">Rating <b class="rating-out" id="ratingOut">8</b><span class="rating-of">/ 10</span></label>
            <input type="range" id="fRating" min="1" max="10" step="0.5" value="8">
            <div class="rating-scale"><span>Never again</span><span>Perfect</span></div>
          </div>
        </div>
      </section>

      <section class="group">
        <p class="group__label">The photo</p>
        <div class="tabs" role="tablist">
          <button type="button" class="tab is-on" data-tab="upload">Upload a photo</button>
          <button type="button" class="tab" data-tab="url">Paste an image link</button>
        </div>

        <div class="tabpane" id="pane-upload">
          <label class="drop" id="drop">
            <input type="file" id="fFile" accept="image/*" hidden>
            <span class="drop__icon">↑</span>
            <span class="drop__title" id="dropTitle">Choose a photo or drop it here</span>
            <span class="drop__note">JPG, PNG or WebP</span>
          </label>

          <div class="field">
            <label for="fPublicId">File name on Cloudinary</label>
            <input type="text" id="fPublicId" placeholder="rock-shrimp-chef-james">
          </div>

          <div class="field">
            <label>Folder</label>
            <div class="folder">
              <div class="folder__crumbs" id="folderCrumbs"></div>
              <div class="folder__list" id="folderList"></div>
              <div class="folder__new">
                <input type="text" id="fNewFolder" placeholder="New folder in here">
                <button type="button" class="btn btn--tiny" id="folderAdd">Create</button>
              </div>
              <p class="hint" id="folderHint"></p>
            </div>
          </div>
        </div>

        <div class="tabpane" id="pane-url" hidden>
          <div class="field">
            <label for="fUrl">Image link</label>
            <input type="url" id="fUrl" placeholder="https://res.cloudinary.com/…/photo.jpg">
          </div>
        </div>

        <div class="preview" id="preview" hidden><img id="previewImg" alt="" loading="lazy" decoding="async"></div>
      </section>

      <p class="form__error" id="addError" hidden></p>

      <div class="form__actions">
        <a class="btn" href="index.html">Cancel</a>
        <button type="submit" class="btn btn--primary" id="addSubmit">Save to the log</button>
      </div>
    </form>
  </section>

  <section class="done" id="donePanel" hidden>
    <div class="done__shot"><img id="doneImg" alt="" loading="lazy" decoding="async"></div>
    <p class="eyebrow">Saved</p>
    <h1 class="page__title" id="doneTitle"></h1>
    <p class="page__note" id="doneNote"></p>
    <div class="form__actions form__actions--center">
      <button type="button" class="btn" id="againBtn">Add another</button>
      <a class="btn btn--primary" href="index.html">See it on the log</a>
    </div>
  </section>

</main>

<div class="saving" id="saving" hidden>
  <div class="saving__box">
    <div class="saving__ring"></div>
    <p class="saving__step" id="savingStep">Uploading photo</p>
    <div class="progress"><span id="progressBar"></span></div>
    <p class="saving__note">Hang on, don't close this tab.</p>
  </div>
</div>

<script type="module" src="assets/js/add.js"></script>
  <script defer src="../../assets/js/motion.js"></script>
</body>
</html>
