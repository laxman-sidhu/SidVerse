<!DOCTYPE html>
<html lang="en" data-section="books">
<head>
<script>(function(){try{var t=localStorage.getItem("sidcinema-theme")||"light";document.documentElement.setAttribute("data-theme",t);document.documentElement.setAttribute("data-bs-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SidVerse — SidBooks</title>
<meta name="description" content="Search millions of books, see what people are reading, and keep track of what I have read.">
<link rel="icon" href="https://img.freepik.com/premium-vector/sid-letter-logo-design-technology-company-sid-logo-design-black-white-color-combination-sid-logo-sid-vector-sid-design-sid-icon-sid-alphabet-sid-typography-logo-design_229120-161627.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://covers.openlibrary.org">
<link rel="preconnect" href="https://books.google.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/shell.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script defer src="../../assets/js/site.config.js"></script>
<script defer src="../../assets/js/shell.js" data-root="../.."></script>
<link rel="modulepreload" href="js/pages/discover.js">
<link rel="stylesheet" href="../../assets/css/universal.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/motion.css">
</head>
<body>

<header class="topbar" data-nav></header>

<section class="hero">
  <div class="shell">
   <div class="hero__main">
    <div class="hero__col">
     <div class="hero__lede">
      <p class="hero__eyebrow">One reader, one shelf</p>
      <h1 class="hero__title" data-phrase></h1>
      <p class="hero__sub">Search millions of books, see what the world is reading this week, and mark what I have finished — it goes straight into the sheet.</p>
    </div>

     <form class="searchbox" data-search-form role="search">
      <svg class="searchbox__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></svg>
      <input class="searchbox__input" data-search-input type="search" placeholder="A title, an author, an ISBN…" aria-label="Search for a book" autocomplete="off">
      <span class="scopepick"><select data-scope aria-label="Search by"></select></span>
      <button class="searchbox__go" type="submit">Search</button>
    </form>

      <div class="chiprow" data-subjects aria-label="Browse by subject"></div>
    </div>

    <div class="reader-cut">
      <div class="reader-cut__blobs" aria-hidden="true">
        <span class="rblob rblob--plum"></span>
        <span class="rblob rblob--sky"></span>
        <span class="rblob rblob--warm"></span>
      </div>
      <img class="reader-cut__img reader-cut__img--photo" src="assets/images/siddhesh.jpeg"
           alt="The keeper of this shelf, mid-chapter" width="713" height="571" loading="eager">
    </div>
   </div>
  </div>
</section>

<main class="stage">
  <div class="wide">
    <div class="stage__head">
      <div class="stage__bar">
        <div class="stage__bar-l">
          <h2 class="stage__title" data-headline>What people are reading</h2>
          <button class="linkbtn" type="button" data-clear hidden>Back to trending</button>
        </div>

        <div class="pillrow" data-periods></div>

        <div class="stage__bar-r">
          <div class="refinewrap">
            <button class="refinebtn" type="button" data-refine-toggle aria-expanded="false" aria-controls="refine-panel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
              <span>Refine</span>
              <span class="refinebtn__count" data-refine-count hidden>0</span>
              <span class="refinebtn__caret" aria-hidden="true"></span>
            </button>

            <div class="refine" id="refine-panel" data-refine hidden>
              <label class="selectwrap"><span class="filters__label">Sort</span><select data-sort></select></label>
              <label class="selectwrap"><span class="filters__label">Language</span><select data-language></select></label>
              <label class="selectwrap"><span class="filters__label">Published</span><select data-era></select></label>
              <label class="selectwrap"><span class="filters__label">Availability</span><select data-ebook></select></label>
              <button class="linkbtn refine__reset" type="button" data-reset-filters hidden>Clear filters</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="stage__note" data-note hidden></p>
    <div class="statusrow" data-status role="group" aria-label="Narrow these results by what the shelf says" hidden></div>

    <div class="grid" data-grid></div>
    <div class="more" data-more hidden>
      <button class="btn btn--solid more__btn" type="button" data-more-btn>Load more</button>
      <p class="more__note" data-more-note></p>
    </div>
  </div>
</main>



<footer class="footer">
  <div class="shell footer__inner">
    <p class="footer__text">Every book I have read, kept in one spreadsheet.</p>
    <div class="footer__links">
      <a class="footer__link" href="https://www.instagram.com/sawant_sidhu/?hl=en" target="_blank" rel="noopener" title="Siddhesh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </a>
    </div>
  </div>
</footer>

<script type="module" src="js/pages/discover.js"></script>
  <script defer src="../../assets/js/motion.js"></script>
</body>
</html>
